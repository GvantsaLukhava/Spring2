<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">Inventory Admin</h1>
            <span class="bg-blue-500 text-xs px-3 py-1 rounded-full uppercase font-semibold">Full Access</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 class="text-lg font-bold text-gray-700 mb-4">Add New Category</h3>
                <form id="category-form" onsubmit="createCategory(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Category Name</label>
                        <input type="text" id="cat-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Description</label>
                        <input type="text" id="cat-desc" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">
                        Save Category
                    </button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 class="text-lg font-bold text-gray-700 mb-4">Add New Product</h3>
                <form id="product-form" onsubmit="createProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Product Name</label>
                        <input type="text" id="form-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">SKU (Stock Keeping Unit)</label>
                        <input type="text" id="form-sku" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Price (EUR)</label>
                            <input type="number" id="form-price" step="0.01" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Quantity</label>
                            <input type="number" id="form-quantity" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Category</label>
                        <select id="form-categoryId" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-blue-500">
                            </select>
                    </div>
                    
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">
                        Save Product
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-700">Current Stock Inventory</h2>
                <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                    Refresh
                </button>
            </div>

            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6"></div>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-gray-600 text-xs uppercase font-semibold">
                            <th class="p-4">Name / SKU</th>
                            <th class="p-4">Price</th>
                            <th class="p-4">Quantity</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body" class="divide-y divide-gray-100 text-sm">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-gray-400 italic">Loading products...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Refresh everything helper
        function refreshData() {
            loadCategories();
            loadProducts();
        }

        // 1. FETCH AND RENDER CATEGORIES (GET)
        async function loadCategories() {
            const selectDropdown = document.getElementById('form-categoryId');
            try {
                const response = await fetch('/api/categories');
                if (!response.ok) throw new Error('Failed to load categories');
                
                const data = await response.json();
                const categories = data.content || data;

                selectDropdown.innerHTML = '';
                if (categories.length === 0) {
                    selectDropdown.innerHTML = '<option value="">Create a category first</option>';
                    return;
                }

                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    selectDropdown.appendChild(option);
                });
            } catch (error) {
                console.error("Error loading categories:", error);
            }
        }

        // 2. CREATE CATEGORY (POST)
        async function createCategory(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('error-message');
            
            const payload = {
                name: document.getElementById('cat-name').value,
                description: document.getElementById('cat-desc').value
            };

            try {
                errorDiv.classList.add('hidden');
                const response = await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || 'Error creating category.');
                }

                document.getElementById('category-form').reset();
                loadCategories();
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
            }
        }

        // 3. FETCH AND RENDER PRODUCTS (GET)
        async function loadProducts() {
            const tableBody = document.getElementById('product-table-body');
            const errorDiv = document.getElementById('error-message');
            try {
                errorDiv.classList.add('hidden');
                const response = await fetch('/api/products');
                if (!response.ok) throw new Error('API error during loading process');
                
                const data = await response.json();
                const products = data.content || data;

                tableBody.innerHTML = '';
                if (products.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">No products found.</td></tr>`;
                    return;
                }

                products.forEach(product => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 transition";
                    row.innerHTML = `
                        <td class="p-4">
                            <div class="font-semibold text-gray-900">${product.name}</div>
                            <div class="text-xs text-gray-400 font-mono">${product.sku}</div>
                        </td>
                        <td class="p-4 font-medium text-blue-600">${Number(product.price).toFixed(2)} EUR</td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${product.quantity > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${product.quantity} units
                            </span>
                        </td>
                        <td class="p-4">
                            <button onclick="toggleActive(${product.id})" class="cursor-pointer flex items-center hover:opacity-80">
                                <span class="h-2 w-2 rounded-full mr-2 ${product.active !== false ? 'bg-green-500' : 'bg-gray-400'}"></span>
                                <span class="text-xs underline text-gray-600">${product.active !== false ? 'Active' : 'Inactive'}</span>
                            </button>
                        </td>
                        <td class="p-4 text-right">
                            <button onclick="deleteProduct(${product.id})" class="text-red-600 hover:text-red-900 font-medium text-xs bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition">
                                Delete
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
            }
        }

        // 4. CREATE PRODUCT (POST)
        async function createProduct(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('error-message');
            
            const payload = {
                name: document.getElementById('form-name').value,
                sku: document.getElementById('form-sku').value,
                price: parseFloat(document.getElementById('form-price').value),
                quantity: parseInt(document.getElementById('form-quantity').value),
                categoryId: parseInt(document.getElementById('form-categoryId').value)
            };

            try {
                errorDiv.classList.add('hidden');
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || 'Error saving product.');
                }

                document.getElementById('product-form').reset();
                loadProducts();
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
            }
        }

        // 5. DELETE PRODUCT (DELETE)
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                const response = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Deletion process failed.');
                loadProducts();
            } catch (error) {
                alert(error.message);
            }
        }

        // 6. TOGGLE STATUS ACTIVE/INACTIVE (PATCH)
        async function toggleActive(id) {
            try {
                const response = await fetch(`/api/products/${id}/toggle-active`, { method: 'PATCH' });
                if (!response.ok) throw new Error('Status alteration failed.');
                loadProducts();
            } catch (error) {
                alert(error.message);
            }
        }

        // Run functions immediately on view load
        window.onload = function() {
            loadCategories();
            loadProducts();
        };
    </script>
</body>
</html>
