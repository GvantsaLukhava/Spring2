# =============================================
# APPLICATION CONFIGURATION
# =============================================
spring.application.name=inventory-api
server.port=8080

# =============================================
# DATABASE CONFIGURATION
# =============================================
# These values reference environment variables set in docker-compose.yml
# The syntax ${VAR_NAME:default_value} means: use env var, or fall back to default
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
spring.datasource.username=${DB_USERNAME:inventory_user}
spring.datasource.password=${DB_PASSWORD:inventory_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / HIBERNATE CONFIGURATION
# =============================================
# validate = checks schema matches entities but doesn't change it (safe for production)
# update  = automatically alters tables to match entities (ok for development)
# create  = drops and recreates tables on every start (useful for testing only)
spring.jpa.hibernate.ddl-auto=update

# Shows SQL in the logs - very helpful for learning and debugging
# Set to false in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate which SQL dialect to use (PostgreSQL-specific functions/types)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# PAGINATION CONFIGURATION
# =============================================
# Enables /api/products?page=0&size=10&sort=name,asc query param parsing
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# =============================================
# LOGGING
# =============================================
logging.level.com.inventory=DEBUG
logging.level.org.springframework.web=INFO
